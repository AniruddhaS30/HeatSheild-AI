services:
  - type: web
    name: hews-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hews-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173

databases:
  - name: hews-db
    plan: free
